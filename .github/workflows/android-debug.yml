name: Compilar APK de prueba
on:
  workflow_dispatch:
  push:
    branches: [main, review/mi-armario-5.4]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Comprobar JavaScript
        run: npm test
      - name: Instalar Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generar proyecto Android
        run: npx cap add android
      - name: Integrar exportación nativa
        run: cp native-android/*.java android/app/src/main/java/mx/miarmario/personal/
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mi-armario-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
