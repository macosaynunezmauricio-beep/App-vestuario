name: Compilar APK de prueba
on:
  workflow_dispatch:
  push:
    branches: [main, review/mi-armario-5.4, review/mi-armario-integral, review/tryon-fidelity, review/local-garment-shaping, review/estudio-movil, review/ajuste-fotografico, review/estilo-minimalista, review/probador-articulado, review/recorte-y-primer-plano, review/conjuntos-locales, review/registro-multiple, review/integracion-probador]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Comprobar JavaScript
        run: npm test
      - name: Preparar navegador de prueba
        run: npx playwright install --with-deps chromium
      - name: Probar editor sin conexión
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-editor-local
          path: test-results/
          if-no-files-found: ignore
      - name: Instalar Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generar proyecto Android
        run: npx cap add android
      - name: Integrar funciones nativas y modelo local
        run: |
          cp native-android/*.java android/app/src/main/java/mx/miarmario/personal/
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/' android/variables.gradle
          mkdir -p android/app/src/main/assets
          curl -fL --retry 3 https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task -o android/app/src/main/assets/pose_landmarker_lite.task
          echo '59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a  android/app/src/main/assets/pose_landmarker_lite.task' | sha256sum -c -
          assets=android/app/src/main/assets
          curl -fL --retry 3 https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite -o "$assets/magic_touch.tflite"
          curl -fL --retry 3 https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/1/selfie_multiclass_256x256.tflite -o "$assets/selfie_multiclass.tflite"
          echo "e24338a717c1b7ad8d159666677ef400babb7f33b8ad60c4d96db4ecf694cd25  $assets/magic_touch.tflite" | sha256sum -c -
          echo "c6748b1253a99067ef71f7e26ca71096cd449baefa8f101900ea23016507e0e0  $assets/selfie_multiclass.tflite" | sha256sum -c -
          printf "\ndependencies { implementation 'com.google.mediapipe:tasks-vision:0.10.14'\nimplementation 'org.tensorflow:tensorflow-lite:2.16.1' }\n" >> android/app/build.gradle
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mi-armario-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  android-smoke:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: mi-armario-debug-apk
          path: build-test
      - name: Preparar prueba con fotografía pública de MediaPipe
        run: |
          curl -fL --retry 3 https://storage.googleapis.com/mediapipe-assets/pose.jpg -o /tmp/pose.jpg
          echo 'c8a830ed683c0276d713dd5aeda28f415f10cd6291972084a40d0d8b934ed62b  /tmp/pose.jpg' | sha256sum -c -
          curl -fL --retry 3 'https://images.pexels.com/photos/28079589/pexels-photo-28079589.jpeg?auto=compress&cs=tinysrgb&w=600' -o /tmp/outfit.jpg
          echo 'fe027760b9e286dcff0d77aa3e7dd6b24df6ad297180e78c05c99084872bb0f9  /tmp/outfit.jpg' | sha256sum -c -
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar y probar el APK sin conexión
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build-test/app-debug.apk
            node checks/android.cjs /tmp/pose.jpg /tmp/outfit.jpg
