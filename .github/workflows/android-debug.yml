name: Compilar APK de prueba
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms" || { echo "No se encontró el SDK de Android"; exit 1; }
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || { echo "No se encontró sdkmanager"; exit 1; }
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Generar proyecto Android
        run: npx cap add android
      - name: Sincronizar archivos
        run: npx cap sync android
      - name: Compilar APK de prueba
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mi-armario-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
